<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Restaurante{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% load permisos_tags %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}">Restaurante</a>
            <div>
                <a class="btn btn-outline-light me-2" href="{% url 'ver_carta' %}">Carta</a>
                <a class="btn btn-outline-info me-2" href="{% url 'pedido_domicilio_crear' %}">Pedir domicilio</a>
                {% if user.is_authenticated %}
                {% if user|es_mesero_o_admin %}
                <a class="btn btn-success me-2" href="{% url 'pedidos_local_lista' %}">Pedidos local</a>
                {% endif %}
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-warning">Cerrar sesion</button>
                </form>
                {% else %}
                <a class="btn btn-primary me-2" href="{% url 'login' %}">Iniciar sesion</a>
                <a class="btn btn-warning" href="{% url 'registro' %}">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
