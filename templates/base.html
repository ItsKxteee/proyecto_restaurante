<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Restaurante{% endblock %}</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}">🍽 Restaurante</a>

            <div>
                <a class="btn btn-outline-light me-2" href="{% url 'ver_carta' %}">Carta</a>

                {% if user.is_authenticated %}
                <a class="btn btn-success me-2" href="{% url 'crear_pedido' %}">Hacer Pedido</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-warning">
                        Cerrar sesión
                    </button>
                </form>
                {% else %}
                <a class="btn btn-primary me-2" href="{% url 'login' %}">Iniciar sesión</a>
                <a class="btn btn-warning" href="{% url 'registro' %}">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
