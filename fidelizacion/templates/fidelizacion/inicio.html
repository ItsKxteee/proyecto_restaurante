{% extends 'base.html' %}
{% load permisos_tags %}

{% block title %}Inicio{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-5">Sistema de pedidos</h1>
    <p class="lead mt-3">
        Puedes crear pedidos en el local por mesa o pedir a domicilio.
    </p>
    <div class="mt-4">
        <a class="btn btn-primary btn-lg me-2" href="{% url 'ver_carta' %}">Ver carta</a>
        <a class="btn btn-info btn-lg me-2" href="{% url 'pedido_domicilio_crear' %}">Pedir domicilio</a>
        {% if user|es_mesero_o_admin %}
        <a class="btn btn-success btn-lg" href="{% url 'pedidos_local_lista' %}">Pedidos local</a>
        {% endif %}
    </div>
</div>
{% endblock %}
