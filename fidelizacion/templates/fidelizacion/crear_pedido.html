{% extends 'base.html' %}

{% block title %}Realizar Pedido{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow p-4">
            <h2 class="text-center mb-4">🛒 Realizar Pedido</h2>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        Confirmar Pedido
                    </button>
                </div>
            </form>

        </div>

    </div>
</div>

{% endblock %}
